<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1080" fill="url(#bgGrad)" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="72" fill="url(#headerGrad)" rx="12"/>
  <rect x="0" y="52" width="900" height="20" fill="url(#headerGrad)"/>
  <text x="450" y="30" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Chess Cognify  PDF Ingestion Pipeline</text>
  <text x="450" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">BookProcessor · Docling · OpenAI Embeddings · Qdrant</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- STEP 1  User Upload -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="96" width="840" height="88" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="96" width="6" height="88" rx="3" fill="url(#apiGrad)"/>

  <!-- Step badge -->
  <rect x="48" y="110" width="28" height="28" rx="14" fill="#3b82f6"/>
  <text x="62" y="129" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text>

  <text x="90" y="127" fill="#1e293b" font-size="14" font-weight="700">User Upload  POST /api/books/upload</text>
  <text x="90" y="148" fill="#64748b" font-size="12">Client sends chess PDF via multipart/form-data</text>

  <!-- Sub-boxes inside step 1 -->
  <rect x="90" y="158" width="190" height="18" rx="4" fill="#eff6ff"/>
  <text x="185" y="171" text-anchor="middle" fill="#3b82f6" font-size="11">Validate: .pdf extension</text>

  <rect x="295" y="158" width="200" height="18" rx="4" fill="#eff6ff"/>
  <text x="395" y="171" text-anchor="middle" fill="#3b82f6" font-size="11">Save file ’ uploads/books/{uuid}_{name}</text>

  <rect x="510" y="158" width="200" height="18" rx="4" fill="#eff6ff"/>
  <text x="610" y="171" text-anchor="middle" fill="#3b82f6" font-size="11">DB: Book record status=pending</text>

  <rect x="725" y="158" width="135" height="18" rx="4" fill="#eff6ff"/>
  <text x="792" y="171" text-anchor="middle" fill="#3b82f6" font-size="11">Spawn BackgroundTask</text>

  <!-- Arrow 1’2 -->
  <line x1="450" y1="184" x2="450" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- STEP 2  Docling Conversion -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="202" width="840" height="108" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="202" width="6" height="108" rx="3" fill="url(#processGrad)"/>

  <rect x="48" y="216" width="28" height="28" rx="14" fill="#8b5cf6"/>
  <text x="62" y="235" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text>

  <text x="90" y="233" fill="#1e293b" font-size="14" font-weight="700">Docling PDF Parsing  DocumentConverter</text>
  <text x="90" y="253" fill="#64748b" font-size="12">PdfPipelineOptions(generate_picture_images=True)  layout-aware structural extraction</text>

  <!-- Three sub-lanes -->
  <rect x="90" y="263" width="246" height="36" rx="6" fill="#f5f3ff"/>
  <text x="213" y="279" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">Text Blocks</text>
  <text x="213" y="294" text-anchor="middle" fill="#7c3aed" font-size="10">TextItem, SectionHeaderItem ’ raw text</text>

  <rect x="349" y="263" width="200" height="36" rx="6" fill="#f5f3ff"/>
  <text x="449" y="279" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">Images (PictureItem)</text>
  <text x="449" y="294" text-anchor="middle" fill="#7c3aed" font-size="10">Save as JPEG ’ /book_images/{id}</text>

  <rect x="562" y="263" width="296" height="36" rx="6" fill="#f5f3ff"/>
  <text x="710" y="279" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">Headings (SectionHeaderItem)</text>
  <text x="710" y="294" text-anchor="middle" fill="#7c3aed" font-size="10">Outline tree ’ chapter hierarchy mindmap</text>

  <!-- Arrow 2’3 -->
  <line x1="450" y1="310" x2="450" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- STEP 3  Buffering & Block Assembly -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="328" width="840" height="118" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="328" width="6" height="118" rx="3" fill="url(#processGrad)"/>

  <rect x="48" y="342" width="28" height="28" rx="14" fill="#8b5cf6"/>
  <text x="62" y="361" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text>

  <text x="90" y="359" fill="#1e293b" font-size="14" font-weight="700">Single-Pass Item Iteration  Block Assembly</text>
  <text x="90" y="379" fill="#64748b" font-size="12">iterate_items() ’ buffer text, associate images by page proximity (±1 page)</text>

  <!-- Flow chart inside -->
  <rect x="90" y="390" width="140" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="160" y="408" text-anchor="middle" fill="#7c3aed" font-size="11">Page changed &gt; 2?</text>

  <line x1="230" y1="404" x2="265" y2="404" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="247" y="398" text-anchor="middle" fill="#64748b" font-size="10">Yes</text>

  <rect x="265" y="390" width="100" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="315" y="408" text-anchor="middle" fill="#7c3aed" font-size="11">flush_block()</text>

  <line x1="365" y1="404" x2="400" y2="404" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="400" y="390" width="160" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="480" y="408" text-anchor="middle" fill="#7c3aed" font-size="11">Block &gt; 3000 chars?</text>

  <line x1="560" y1="404" x2="595" y2="404" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="577" y="398" text-anchor="middle" fill="#64748b" font-size="10">Yes</text>

  <rect x="595" y="390" width="100" height="28" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="645" y="408" text-anchor="middle" fill="#7c3aed" font-size="11">flush_block()</text>

  <text x="710" y="408" fill="#64748b" font-size="10">’ LangChain Document</text>
  <text x="90" y="436" fill="#475569" font-size="11">  Metadata per block: { source, book_id, page, image_urls[] }</text>

  <!-- Arrow 3’4 -->
  <line x1="450" y1="446" x2="450" y2="464" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- STEP 4  Text Splitting -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="464" width="840" height="80" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="464" width="6" height="80" rx="3" fill="url(#processGrad)"/>

  <rect x="48" y="478" width="28" height="28" rx="14" fill="#8b5cf6"/>
  <text x="62" y="497" text-anchor="middle" fill="white" font-size="13" font-weight="700">4</text>

  <text x="90" y="495" fill="#1e293b" font-size="14" font-weight="700">Recursive Character Text Splitting</text>
  <text x="90" y="515" fill="#64748b" font-size="12">RecursiveCharacterTextSplitter  preserves sentence coherence for embedding quality</text>

  <rect x="90" y="526" width="180" height="10" rx="5" fill="#ede9fe"/>
  <text x="180" y="535" text-anchor="middle" fill="#7c3aed" font-size="11">chunk_size = 800 tokens</text>
  <rect x="290" y="526" width="180" height="10" rx="5" fill="#ede9fe"/>
  <text x="380" y="535" text-anchor="middle" fill="#7c3aed" font-size="11">chunk_overlap = 200 tokens</text>
  <rect x="490" y="526" width="180" height="10" rx="5" fill="#ede9fe"/>
  <text x="580" y="535" text-anchor="middle" fill="#7c3aed" font-size="11">Metadata propagated to each chunk</text>

  <!-- Arrow 4’5 -->
  <line x1="450" y1="544" x2="450" y2="562" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- STEP 5  OpenAI Embeddings -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="562" width="840" height="88" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="562" width="6" height="88" rx="3" fill="#f59e0b"/>

  <rect x="48" y="576" width="28" height="28" rx="14" fill="#f59e0b"/>
  <text x="62" y="595" text-anchor="middle" fill="white" font-size="13" font-weight="700">5</text>

  <text x="90" y="593" fill="#1e293b" font-size="14" font-weight="700">OpenAI Embedding Generation</text>
  <text x="90" y="613" fill="#64748b" font-size="12">LangChain OpenAIEmbeddings  batched API call per chunk via QdrantVectorStore.add_documents()</text>

  <!-- Model info boxes -->
  <rect x="90" y="624" width="250" height="18" rx="4" fill="#fffbeb"/>
  <text x="215" y="637" text-anchor="middle" fill="#b45309" font-size="11">Model: text-embedding-3-small</text>

  <rect x="355" y="624" width="200" height="18" rx="4" fill="#fffbeb"/>
  <text x="455" y="637" text-anchor="middle" fill="#b45309" font-size="11">Dimensions: 1536</text>

  <rect x="570" y="624" width="200" height="18" rx="4" fill="#fffbeb"/>
  <text x="670" y="637" text-anchor="middle" fill="#b45309" font-size="11">Distance metric: Cosine</text>

  <!-- Arrow 5’6 -->
  <line x1="450" y1="650" x2="450" y2="668" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- STEP 6  Qdrant Storage -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="668" width="840" height="108" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="668" width="6" height="108" rx="3" fill="url(#storeGrad)"/>

  <rect x="48" y="682" width="28" height="28" rx="14" fill="#10b981"/>
  <text x="62" y="701" text-anchor="middle" fill="white" font-size="13" font-weight="700">6</text>

  <text x="90" y="699" fill="#1e293b" font-size="14" font-weight="700">Qdrant Vector Storage  QdrantVectorStore.add_documents()</text>
  <text x="90" y="719" fill="#64748b" font-size="12">Each point = 1536-dim vector + payload metadata. Collection auto-created if absent.</text>

  <!-- Qdrant payload visualization -->
  <rect x="90" y="730" width="750" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="112" y="745" fill="#166534" font-size="11" font-weight="600">Qdrant Point Payload:</text>
  <text x="112" y="761" fill="#166534" font-size="10">{ "page_content": "...", "metadata": { "source": "book.pdf", "book_id": "uuid", "page": N, "image_urls": [...] } }</text>

  <!-- Arrow 6’7 -->
  <line x1="450" y1="776" x2="450" y2="794" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- STEP 7  DB Update -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="794" width="840" height="80" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="794" width="6" height="80" rx="3" fill="url(#storeGrad)"/>

  <rect x="48" y="808" width="28" height="28" rx="14" fill="#10b981"/>
  <text x="62" y="827" text-anchor="middle" fill="white" font-size="13" font-weight="700">7</text>

  <text x="90" y="825" fill="#1e293b" font-size="14" font-weight="700">PostgreSQL  Book Record Update</text>
  <text x="90" y="845" fill="#64748b" font-size="12">Atomic commit: status, chunk count, and Docling outline tree (mindmap JSON)</text>

  <rect x="90" y="856" width="190" height="10" rx="5" fill="#dcfce7"/>
  <text x="185" y="865" text-anchor="middle" fill="#15803d" font-size="11">status = "completed"</text>
  <rect x="295" y="856" width="190" height="10" rx="5" fill="#dcfce7"/>
  <text x="390" y="865" text-anchor="middle" fill="#15803d" font-size="11">total_chunks = N</text>
  <rect x="500" y="856" width="250" height="10" rx="5" fill="#dcfce7"/>
  <text x="625" y="865" text-anchor="middle" fill="#15803d" font-size="11">outline = { chapter tree JSON }</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- Error path note -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="890" width="840" height="44" rx="10" fill="#fef2f2" filter="url(#shadow)"/>
  <rect x="30" y="890" width="6" height="44" rx="3" fill="#ef4444"/>
  <text x="90" y="908" fill="#991b1b" font-size="12" font-weight="600">Error Handling</text>
  <text x="90" y="926" fill="#dc2626" font-size="11">Any exception in steps 2-7 ’ DB: status="failed", error_message=str(e), background task exits cleanly</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- Legend -->
  <!-- PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP -->
  <rect x="30" y="946" width="840" height="110" rx="10" fill="#1e293b"/>
  <text x="450" y="968" text-anchor="middle" fill="white" font-size="13" font-weight="700">Legend</text>

  <!-- Legend items row 1 -->
  <rect x="60" y="978" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="82" y="990" fill="#cbd5e1" font-size="11">API / FastAPI layer</text>

  <rect x="220" y="978" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="242" y="990" fill="#cbd5e1" font-size="11">Processing / Docling</text>

  <rect x="400" y="978" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="422" y="990" fill="#cbd5e1" font-size="11">OpenAI (external API)</text>

  <rect x="580" y="978" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="602" y="990" fill="#cbd5e1" font-size="11">Storage (Qdrant + PG)</text>

  <!-- Legend items row 2 -->
  <text x="60" y="1018" fill="#94a3b8" font-size="11">Async: FastAPI BackgroundTasks runs the entire ingestion pipeline off the request thread</text>
  <text x="60" y="1036" fill="#94a3b8" font-size="11">Images: Docling extracts chess diagram PNGs ’ saved as JPEG ’ URL stored in chunk metadata for VLM analysis at query time</text>
  <text x="60" y="1054" fill="#94a3b8" font-size="11">Outline: SectionHeaderItems ’ hierarchical chapter/section tree ’ stored as JSONB in PG ’ powers mindmap UI + suggested queries</text>
</svg>
